<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="phGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#phBg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="320" cy="180" r="100" fill="url(#phGlow)" opacity="0.15" />

  <!-- Decorative Border -->
  <rect x="16" y="16" width="608" height="328" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Center Video Play Placeholder Icon -->
  <circle cx="320" cy="180" r="44" fill="rgba(255,255,255,0.05)" stroke="url(#phGlow)" stroke-width="2" />
  <polygon points="312,162 336,180 312,198" fill="url(#phGlow)" />

  <!-- VideoHub Branding text -->
  <text x="320" y="250" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2" text-anchor="middle">
    VIDEOHUB
  </text>
</svg>
