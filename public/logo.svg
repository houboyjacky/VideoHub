<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="1" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backlight -->
  <circle cx="60" cy="60" r="45" fill="url(#playGrad)" opacity="0.25" filter="url(#subtleGlow)" />

  <!-- Base Rounded Card with Glass Border -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Stream Arc Ring -->
  <path d="M 38 28 A 36 36 0 0 1 82 28" fill="none" stroke="url(#playGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 88 40 A 36 36 0 0 1 88 80" fill="none" stroke="url(#playGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

  <!-- Play Symbol (Rounded Triangle) with Glow -->
  <polygon points="50,42 78,60 50,78" fill="url(#playGrad)" filter="url(#glow)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  
  <!-- Subtle Lens Flare Highlight -->
  <ellipse cx="44" cy="30" rx="20" ry="8" fill="white" opacity="0.08" transform="rotate(-25 44 30)" />
</svg>
